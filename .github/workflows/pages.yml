name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Commits pushed by the regressions workflow use GITHUB_TOKEN, which does not
  # trigger push events, so deploy after it instead. The build job skips when
  # that run committed nothing (main is still at the commit it started from).
  workflow_run:
    workflows: [regressions]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha != github.sha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate data files
        run: node scripts/validate.mjs
      - name: Build the site
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
