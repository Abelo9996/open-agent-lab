name: regressions

# Aggregates community regression reports (open issues labeled
# regression-report) into data/regressions.json. Issue bodies are untrusted:
# they are only read through the API by scripts/aggregate-regressions.mjs,
# parsed as JSON and validated. No issue field is ever interpolated into a
# shell command here.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]

permissions: {}

concurrency:
  group: regressions
  cancel-in-progress: false

jobs:
  aggregate:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'regression-report') ||
      github.event.label.name == 'regression-report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test the parser, validator and aggregator
        run: node --test tests/regressions.test.mjs
      - name: Aggregate open regression-report issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/aggregate-regressions.mjs
      - name: Validate data files
        run: node scripts/validate.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/regressions.json; then
            echo "data/regressions.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regressions.json
          git commit -m "Update regression watch aggregates"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
